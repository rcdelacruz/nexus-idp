# On-premises overrides — loaded ONLY by the homelab (Talos k8s) Backstage instance.
# deploy.sh appends: --config app-config.on-prem.yaml
# Dockerfile.with-migrations (ECS) does NOT load this file.

scaffolder:
  # ── On-prem Kubernetes Deployment Targets ──────────────────────────────────
  # Talos homelab k8s cluster — pre-existing on-prem, not provisioned via template.
  # Cloud-provisioned k8s clusters (EKS) are auto-discovered from the catalog instead.
  targets:
    kubernetes:
      - name: talos-homelab
        displayName: 'Talos Homelab (Self-hosted)'
        type: k8s-selfhosted
        ingressDomain: ${SCAFFOLDER_INGRESS_DOMAIN}
        storageClass: longhorn
        ingressClass: traefik
        argocdUrl: ${ARGOCD_URL}
        supportedFrameworks: [nextjs, nodejs, nestjs, springboot, python]

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - name: talos-homelab
          # In-cluster URL — works because Backstage runs inside the same cluster.
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          # In-cluster token: no serviceAccountToken or caData needed.
          # The Backstage pod must run with serviceAccountName: backstage-k8s-reader
          skipTLSVerify: false
          skipMetricsLookup: false

# ── Grafana (entity Monitoring tab) ───────────────────────────────────────────
# Homelab kube-prometheus-stack (namespace: monitoring). Homelab-only: environments without a
# grafana block never build the Grafana API — the Monitoring tab and alerts card only render for
# entities with grafana/* annotations (verified: config:check passes with no grafana block).
#   GRAFANA_URL          in-cluster API target (backend proxy → Grafana)
#   GRAFANA_TOKEN        Grafana service-account token, Viewer role
#   GRAFANA_FRONTEND_URL browser-reachable Grafana URL (dashboard/alert links point here)
proxy:
  endpoints:
    '/grafana/api':
      # Fallback keeps the backend booting if GRAFANA_URL is missing from backstage-secrets: an unset
      # target makes the proxy plugin throw at startup ("Proxy target ... must be a string"). With the
      # fallback, the Grafana cards just show a connection error until the secret is added.
      target: ${GRAFANA_URL:-http://grafana-not-configured.invalid}
      changeOrigin: true
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

grafana:
  domain: ${GRAFANA_FRONTEND_URL}
  # kube-prometheus-stack uses unified alerting; the plugin defaults to legacy (returns nothing)
  unifiedAlerting: true
