services:
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: {{resourceName}}-frontend
    ports:
      - "{{port}}:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:{{backendPort}}/api
    restart: unless-stopped
    networks:
      - {{resourceName}}-network

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: {{resourceName}}-backend
    ports:
      - "{{backendPort}}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: unless-stopped
    networks:
      - {{resourceName}}-network

  postgres:
    image: postgres:13-alpine
    container_name: {{resourceName}}-postgres
    ports:
      - "{{postgresPort}}:5432"
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - {{resourceName}}-postgres-data:/var/lib/postgresql/data
      - ./app/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - {{resourceName}}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  {{resourceName}}-network:
    driver: bridge

volumes:
  {{resourceName}}-postgres-data:
